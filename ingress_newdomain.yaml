apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cse-undergrad-gp-manage-school-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "2g"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

spec:
  rules:
    - host: cssys.skku.ac.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cse-undergrad-gp-manage-service
                port:
                  number: 80
